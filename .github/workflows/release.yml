name: Build & Release

# 触发条件
on:
  # 当推送 v* 格式的 tag 时触发（如 v1.6.0）
  push:
    tags:
      - 'v*'
  # 手动触发：在 GitHub Actions 页面可以手动运行此工作流
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（格式：1.5.0)'
        required: false
        type: string
      build_only:
        description: '仅构建不发布'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 第一步：检出代码
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 2

      # 第二步：检测版本号是否变更
      - name: Detect version change
        id: version
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          CURRENT_FULL=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          CURRENT_NAME=$(echo "$CURRENT_FULL" | cut -d'+' -f1)
          CURRENT_CODE=$(echo "$CURRENT_FULL" | cut -d'+' -f2)

          VERSION_NAME=${INPUT_VERSION:-$CURRENT_NAME}
          VERSION_CODE=$CURRENT_CODE

          PREVIOUS_FULL=$(git show HEAD~1:pubspec.yaml 2>/dev/null | grep '^version:' | awk '{print $2}' || echo "")
          PREVIOUS_NAME=$(echo "$PREVIOUS_FULL" | cut -d'+' -f1)

          SHOULD_RELEASE="true"
          if [[ "${{ github.event.inputs.build_only }}" == "true" ]]; then
            SHOULD_RELEASE="false"
            echo "::notice::Build only mode enabled via input."
          elif [[ "${{ github.event_name }}" == "push" ]] && [[ "$VERSION_NAME" == "$PREVIOUS_NAME" ]]; then
            SHOULD_RELEASE="false"
            echo "::notice::No version name change detected ($PREVIOUS_NAME -> $VERSION_NAME)."
          fi

          if [ "$SHOULD_RELEASE" == "true" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "build_version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
            echo "build_version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
            echo "::notice::Version $VERSION_NAME will be released."
          else
            NEW_VERSION_CODE=$((VERSION_CODE + 1))
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "build_version_name=$VERSION_NAME-dev.$NEW_VERSION_CODE" >> $GITHUB_OUTPUT
            echo "build_version_code=$NEW_VERSION_CODE" >> $GITHUB_OUTPUT
            echo "::notice::Build only version: $VERSION_NAME-dev.$NEW_VERSION_CODE+$NEW_VERSION_CODE"
          fi

          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE"  >> $GITHUB_OUTPUT
          echo "previous_version=$PREVIOUS_NAME" >> $GITHUB_OUTPUT

      # 第三步：安装 Java 环境
      - name: Set up Java
        uses: actions/setup-java@v4.3.0
        with:
          java-version: '21'
          distribution: 'temurin'

      # 第四步：安装 Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: '3.41.6'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          pub-cache-key: 'flutter-pub-:os:-:channel:-:version:-:arch:-:hash:'

      # 第五步：设置 Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.1.0
        with:
          gradle-version: wrapper
          cache-disabled: false

      # 第六步：安装 Flutter 依赖
      - name: Install dependencies
        run: flutter pub get --offline || flutter pub get

      # 第七步：解码签名密钥（输出到 android/app/ 目录）
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks

      # 在构建 APK 之前预先安装 NDK，避免 Gradle 在配置阶段自动下载失败
      - name: Install Android NDK and accept licenses
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -e
          # 找到 sdkmanager
          if [ -x "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "${ANDROID_SDK_ROOT}/tools/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/tools/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "sdkmanager not found at expected paths"; exit 1
          fi

          NDK_PACKAGE="ndk;27.0.12077973"

          # 重试逻辑以处理临时网络/服务器或损坏的归档
          for i in 1 2 3; do
            echo "Attempt $i to install $NDK_PACKAGE"
            yes | "$SDKMANAGER" --install "$NDK_PACKAGE" && break || {
              echo "Install failed, retrying in 10s..."
              sleep 10
            }
            if [ $i -eq 3 ]; then
              echo "Failed to install $NDK_PACKAGE after retries"; exit 1
            fi
          done

          # 接受许可（宽容处理，不让它失败）
          yes | "$SDKMANAGER" --licenses || true

      # 第八步：编译 APK（✅ 已修正 KEYSTORE_PATH 路径）
      - name: Build APK
        env:
          KEYSTORE_PATH: android/app/release.jks   # ✅ 修正为正确路径
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release --no-pub \
            --target-platform android-arm64 \
            --build-name="${{ steps.version.outputs.build_version_name }}" \
            --build-number="${{ steps.version.outputs.build_version_code }}"

      # 第九步：上传 APK 作为 GitHub Actions 工件
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4.6.0
        with:
          name: HyperIsland-v${{ steps.version.outputs.version_name }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          compression-level: 0

      # 第十步：重命名 APK 文件（仅在版本变更时执行）
      - name: Rename APK for release
        if: steps.version.outputs.changed == 'true'
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            "HyperIsland-v${{ steps.version.outputs.version_name }}.apk"

      # 第十一步：提取更新日志
      - name: Extract changelog
        if: steps.version.outputs.changed == 'true'
        id: changelog
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version_name }}"
          $previousVersion = "${{ steps.version.outputs.previous_version }}"
          $changelogContent = ""

          try {
            if (Test-Path 'docs/CHANGELOG.md') {
              $changelogFile = Get-Content 'docs/CHANGELOG.md' -Raw
              $escapedVersion = [regex]::Escape($version)
              $pattern = "(?ms)^#\s*V$escapedVersion\b[\s\S]*?(?=^#\s*V\d+\.\d+\.\d+\b|\Z)"
              $match = [regex]::Match($changelogFile, $pattern)

              if (-not $match.Success) {
                $pattern = "(?ms)^#\s*V$escapedVersion\s*\([\d-]+\)[\s\S]*?(?=^#\s*V\d+\.\d+\.\d+\s*\(|\Z)"
                $match = [regex]::Match($changelogFile, $pattern)
              }

              if ($match.Success) {
                $section = $match.Value.Trim()
                $lines = $section -split "`n"
                if ($lines.Length -gt 1) {
                  $body = ($lines | Select-Object -Skip 1) -join "`n"
                } else {
                  $body = $section
                }
                $body = $body.Trim()
                if ($body) {
                  echo "已从 CHANGELOG.md 提取版本更新内容"
                  $changelogContent = $body
                }
              }
            }
          } catch {
            echo "从 CHANGELOG.md 提取内容失败: $_"
          }

          if (-not $changelogContent) {
            echo "未在 CHANGELOG.md 中找到版本 $version 的段落，使用提交记录生成更新内容"
            $commitLog = ""

            if ($previousVersion -ne "") {
              try {
                $commits = git log "v$previousVersion"..HEAD --pretty=format:"- %s" 2>$null
                if ($commits) {
                  $commitLog = $commits
                }
              } catch {
                echo "无法获取版本标签间的提交记录"
              }
            }

            if (-not $commitLog) {
              $commits = git log --pretty=format:"- %s" -20 2>$null
              $commitLog = $commits
            }

            $changelogContent = "### 变更日志`n`n$commitLog"
          }

          echo "content<<EOF" >> $env:GITHUB_OUTPUT
          echo "$changelogContent" >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT

      # 第十二步：创建 GitHub Release
      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: HyperIsland v${{ steps.version.outputs.version_name }}
          body: ${{ steps.changelog.outputs.content }}
          files: HyperIsland-v${{ steps.version.outputs.version_name }}.apk
          draft: false
          prerelease: false
